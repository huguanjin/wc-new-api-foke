<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <script>
      (function () {
        var allowed = {
          default: 1,
          anthropic: 1,
          'simple-large': 1,
          underground: 1,
          'rose-garden': 1,
          'lake-view': 1,
          'sunset-glow': 1,
          'forest-whisper': 1,
          'ocean-breeze': 1,
          'lavender-dream': 1,
        }
        var match = document.cookie.match(/(?:^|; )theme_preset=([^;]*)/)
        var preset = match ? decodeURIComponent(match[1]) : 'simple-large'
        if (!allowed[preset]) preset = 'simple-large'
        document.body.setAttribute('data-theme-preset', preset)
      })()
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
